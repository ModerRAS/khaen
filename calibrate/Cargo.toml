[package]
name = "tspi-calibrate"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "泰山派3M 实时音频链路：多声道扬声器延迟/相位/PEQ 校准工具"
license = "GPL-3.0-only"

[dependencies]
realfft = "3"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
num-complex = "0.4"
sha2 = "0.10"

[[bin]]
name = "tspi-calibrate"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true