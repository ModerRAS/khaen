[package]
name = "khaen-daemon"
description = "Control daemon: REST/UI over the host control plane"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
khaen-core = { path = "../core" }
khaen-host = { path = "../host" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "io-util"] }
serde_json = "1"
# 密码哈希：argon2id PHC（PLAN §4.2）。只开 password-hash/std，随机源走 getrandom（不拉 rand 全家桶）。
argon2 = { version = "0.5", default-features = false, features = ["std"] }
# 会话 token / CSRF / 盐的 OS 随机源（本机 cargo 缓存已有 0.2.17）。
getrandom = "0.2"

[dev-dependencies]
# 校准产物 → 控制面两阶段下发的端到端测试：编译真实校准方案并通过 REST 下发/回滚。
khaen-calibration = { path = "../calibration" }
khaen-designer = { path = "../designer" }
