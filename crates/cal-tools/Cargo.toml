[package]
name = "khaen-cal-tools"
description = "Offline calibration CLIs: single-point scene job and closed-loop verdict"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "khaen-single-point"
path = "src/main.rs"

[[bin]]
name = "khaen-closed-loop"
path = "src/bin/closed_loop.rs"

[[bin]]
name = "khaen-plan-levels"
path = "src/bin/plan_levels.rs"

[[bin]]
name = "khaen-band-levels"
path = "src/bin/band_levels.rs"

[[bin]]
name = "khaen-closed-loop-run"
path = "src/bin/closed_loop_run.rs"

[[bin]]
name = "khaen-fir-plan"
path = "src/bin/fir_plan.rs"

[[bin]]
name = "khaen-scene-plan"
path = "src/bin/scene_plan.rs"

[dependencies]
khaen-calibration = { path = "../calibration" }
khaen-core = { path = "../core" }
khaen-mimo-design = { path = "../mimo-design" }
serde_json = "1"

[dev-dependencies]
khaen-plan-builder = { path = "../plan-builder" }
