[package]
name = "khaen-calibration"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Calibration math: deconvolution, parametric-EQ fitting and plan compilation"

[dependencies]
khaen-core = { path = "../core" }
khaen-designer = { path = "../designer" }
khaen-modal-design = { path = "../modal-design" }
khaen-plan-builder = { path = "../plan-builder" }
khaen-mimo-design = { path = "../mimo-design" }

[dev-dependencies]
# 测试用：证明编译出的方案能被 host 的准入与图编译接受（生产代码不依赖 host）。
khaen-host = { path = "../host" }
# 测试用：解析 artifact 包里的 JSON，确保写出来的是合法 JSON（生产代码不依赖 serde_json）。
serde_json = "1"
