[package]
name = "khaen-host"
description = "Block engine: single device owner, SPSC transport, block-boundary commit"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
khaen-core = { path = "../core" }
# T41：AES67 输入 ASRC（rubato 异步重采样 + 抖动环漂移控制）。
khaen-asrc = { path = "../asrc" }
serde_json = "1"

# ALSA 只在 Linux 目标上编译；其余平台的测试走平台无关的假 PCM 设备。
[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.12"
