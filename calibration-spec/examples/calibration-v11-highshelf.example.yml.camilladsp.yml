# 与 calibration-v11-highshelf.example.yml 对应的片段。
# shelf 用 Slope 型：slope = 12 * q = 8.4。FR 延迟 8/48000 s = 1/6 ms。
# channelmap_roles 只是提示；pipeline 里已经有 Gain inverted。两条路二选一。
schema: tspi-calibration-camilladsp/v1
note: "filters/pipeline 可直接合并进渲染后的 CamillaDSP config（极性已由 Gain inverted 实现）；channelmap_roles 仅 advisory，两条路径二选一，勿同时应用以免双反相"
filters:
  cal_ch0_peq0:
    type: Biquad
    parameters:
      type: Highshelf
      freq: 4000.0
      slope: 8.4
      gain: -2.0
  cal_ch1_delay:
    type: Delay
    parameters:
      delay: 0.16666666666666666
      unit: ms
  cal_ch1_peq0:
    type: Biquad
    parameters:
      type: Highshelf
      freq: 5000.0
      slope: 8.4
      gain: 1.5
  cal_ch1_pol:
    type: Gain
    parameters:
      gain: 0.0
      inverted: true
pipeline:
  - type: Filter
    channels: [0]
    names: [cal_ch0_peq0]
  - type: Filter
    channels: [1]
    names: [cal_ch1_delay, cal_ch1_peq0, cal_ch1_pol]
channelmap_roles:
  - index: 1
    inverted: true
    apply: false
    note: "advisory only: fragment pipeline already applies Gain inverted; use channelmap roles[].sources.inverted ONLY instead of pipeline (choose one path, avoid double inversion)"
