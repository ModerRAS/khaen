# 2026-11-23 从 dsp-host 只读抄下的 /etc/tspi-rt-stack/rt-host-nsp16.toml。
# 16 声道播放仍用这份。通用模板 rt-host.toml.example 没有这些播放项。
# 服务名下次安装用 khaen-rt-host；这份配置文件名先保持 nsp16，避免把正在播的链换成通用立体声模板。
# khaen-rt-host 16ch AES67 (NSP 16ch = 2x8 flow, H16 container 8+8) -> plan-arena -> MOTU
[host]
block_size = 128
sample_rate = 48000
workers = 4
graph = "plan-arena"
safe_mode = "normal"

[alsa]
backend = "alsa"
io_mode = "synth"
device = "hw:UltraLitemk5,0"
capture_channels = 20
playback_channels = 22
period_frames = 128
buffer_frames = 1024

[rt]
dsp_cpus = "0-3"
dsp_priority = 70
io_priority = 80
irq_priority = 90
tick_freq_hz = 1000000000
apply_affinity = false

[web]
bind = "127.0.0.1:8090"

[control]
url = "http://127.0.0.1:8090"

[daemon]
config = ""

[paths]
last_good = "/var/lib/tspi-rt-stack/last-good-nsp16.json"
plan = "/var/lib/tspi-rt-stack/plans/plan-h16-16in-identity.bin"

[run]
max_blocks = 0
duration_ms = 0

[capture]
source = "aes67"
mode = "aes67"
aes67_transport = "userspace"
aes67_sdp = "/var/lib/tspi-rt-stack/nsp16-aes67.sdp"
aes67_iface = "192.0.2.222"
# task-320（可选；保持注释 = 旧行为）：
# - 多网卡/多接口（组播每个接口一条显式 join；单播只允许 1 个接口）：
#aes67_iface = ["192.0.2.222", "enp3s0"]
# - 只接受指定组播组（SDP 声明的组不在列表 → 启动 fail-closed）：
#aes67_group_allow = ["239.69.16.146"]
# - RTP 来源白名单（IPv4/CIDR；非白名单来源丢弃并计入 flows[].io.filtered_source）：
#aes67_source_allow = ["192.0.2.0/24"]
aes67_stall_blocks = 400
ptp_lock = "unlocked"
aes67_jitter_latency_us = 64000
aes67_stay_on_stream_end = true
aes67_silence_hold_ms = 80
aes67_stall_fail_close_ms = 60000
aes67_reanchor_watchdog = true
