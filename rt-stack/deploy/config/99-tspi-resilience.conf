# TSPI 板级韧性（2026-11-21）：目标是把"一挂就是 8 小时"变成"30 秒内自己重启 + 留证据"
# 背景：2026-11-20 08:59 板子在不清楚的原因下失去响应（电源灯亮、5V3A 官方电源、ping/ssh 全死），
# 直到 17:46 人为断电重启才恢复（~8h47m），期间没有任何可读证据（pstore 空 = 没有 panic/oops）。
#
# 原则：payload 出现问题时，宁可可恢复地重启，也不要无限期挂死。

# oops/panic 一律记下来并自动重启（配合 ramoops：dmesg-0/1 + console + pmsg 已使能）
kernel.panic_on_oops = 1
kernel.panic = 10

# 锁死检测：硬锁死(NMI/hardlockup)与软锁死都要 panic（默认只打印，打印完还是挂着）
kernel.hardlockup_panic = 1
kernel.softlockup_panic = 1
kernel.softlockup_all_cpu_backtrace = 1

# hung task 只告警不 panic（D 状态阻塞可能是存储慢，panic 反而丢现场）；120s 足够暴露出问题
kernel.hung_task_timeout_secs = 120
kernel.hung_task_warnings = 10

# 保留 SysRq（串口/USB 键盘可 c=crash、b=reboot、w=显示 D 状态任务），便于现场取证据
kernel.sysrq = 1

# 注意：**不要**改 sched_rt_runtime_us（保持板端默认 950000/1000000）。
#   -1（关掉 RT 限流）会让 SCHED_FIFO 线程在 bug 时完全饿死 ksoftirqd/内核线程，
#   表现就是"网络/SSH 全死但板子还在跑"。x86 安装脚本里那条 -1 只适用于压测机，不要照搬到板子。