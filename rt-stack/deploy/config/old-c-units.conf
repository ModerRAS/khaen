# T28 旧音频栈 unit 分类（retire-c.sh / verify-switch.sh / rollback.sh 共用）
# 依据：audio/overlay/etc/systemd/system、web/deploy/khaen-audio-web.service、DSP-HOST-DECISION §7 G-no-C、
#       spec/compat-matrix.md C07/K13/K38/Q04/A11。
# 注意：这里只登记 unit 名；是否安装/是否存在由板端 systemctl 查询决定（不得假设只有一条 camilladsp.service）。

# 1) 旧 C 进程链（CamillaDSP 本体 + 只读其 WS 自动上混 daemon）：必须 stop + disable + mask
RETIRE_C_UNITS=(
  khaen-camilladsp.service
  khaen-upmix-autodetect.service
)

# 2) 旧编排/开机恢复入口：可被 khaen-mode 写 marker 后拉起 C，必须 disable + mask（target 不可 mask，只 disable）
RETIRE_ENTRY_UNITS=(
  khaen-audio.target
  khaen-boot-mode.service
)

# 3) 旧 Web/WS shim：以 CamillaDSP websocket 为后端并操作其 unit，新 daemon/Web 替代后必须停用
REPLACE_SHIM_UNITS=(
  khaen-audio-web.service
)

# 4) AoIP/PTP 组件：P1 保留（新 control 后续接管生命周期，见 compat-matrix A11），T71 不 retire；
#    但切换窗口内必须 inactive（设备独占），且不得由旧 khaen-mode 拉起。
RETAIN_AOIP_UNITS=(
  khaen-statime-inferno.service
  khaen-aes67-daemon.service
  khaen-ravenna-lkm.service
  khaen-ptp4l-master.service
  khaen-phc2sys.service
)

# 5) 退役动作会删除的旧激活入口（文件不存在不算失败；存在则移除并记录 hash）
C_ENTRY_FILES=(
  /run/khaen/camilladsp.yml
  /run/khaen/camilladsp.env
  /etc/khaen/last-mode
  /run/khaen/mode
)

# 6) 旧 C 进程名（pgrep 匹配；retire 前后都必须为空）
C_PROCESS_PATTERNS=(
  camilladsp
  khaen-upmix
)

# 7) 判定“旧栈仍在运行”的 unit 全集（用于设备独占与退役验证）
ALL_OLD_AUDIO_UNITS=(
  "${RETIRE_C_UNITS[@]}"
  "${RETIRE_ENTRY_UNITS[@]}"
  "${REPLACE_SHIM_UNITS[@]}"
  "${RETAIN_AOIP_UNITS[@]}"
)

# 8) 新栈 unit（由 service/ 提供；retire/verify 用它判断新栈是否已启动）
#    task-192：khaen-irq-affinity.service 是 T71 IRQ 亲和持久化 oneshot（Before=khaen-rt-host.service；
#    由 host 的 Requires= 拉起），也按新栈 unit 校验「已安装、未提前 active」。
NEW_STACK_UNITS=(
  khaen-rt-host.service
  khaen-rt-daemon.service
  khaen-irq-affinity.service
  khaen-rt-stack.target
)

# 9) IRQ 亲和：irqbalance 会把 T45 依赖 IRQ 搬回 A72（task-189 实测 ≤25s），04 安装时 disable+stop，
#    preflight/06-verify 用 IRQ_BALANCE_UNIT 查它不得 enabled/active。
IRQ_BALANCE_UNIT="irqbalance.service"
