[package]
name = "khaen-rt-check"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "TSPI offline contract checker CLI：ABI 布局 / RT 禁止行为 / 无析构审计（T06 scaffold）"

[lib]
