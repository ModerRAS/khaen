# KHAEN 离线契约检查 CLI（WBS T06；命令入口 abi-layout/forbid/drop-audit）
# WBS T06 scaffold；本 manifest 只由 integrator 写。
[package]
name = "khaen-rt-check"
license = "GPL-3.0-only"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Offline contract checker: ABI layout, forbidden calls and destructor audits"

[lib]
name = "khaen_rt_check"
path = "src/lib.rs"

[[bin]]
name = "rt-check"
path = "src/main.rs"

[dependencies]
khaen-core = { workspace = true }
khaen-rt-host = { workspace = true }
# T26：file 端到端（WAV -> T14 session/plan -> 4-worker DAG -> WAV）由 rt-check host-file 驱动。
khaen-file-runner = { workspace = true }
