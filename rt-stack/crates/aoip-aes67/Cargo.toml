version.workspace = true
edition.workspace = true
publish.workspace = true
description = "AES67 receiver: SDP, RTP, jitter buffer, media clock and fixed-size capture blocks"

[dependencies]

[lib]
name = "khaen_aoip_aes67"
path = "src/lib.rs"
