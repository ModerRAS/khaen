# 校准里不依赖 rt-host 的部分：反卷积、测点、PEQ 拟合。
# host 要调用 fit_peq / deconvolve，又不能和 khaen-calibration 互相依赖。
[package]
name = "khaen-cal-dsp"
license = "GPL-3.0-only"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Deconvolution and parametric-EQ fitting, independent of the real-time host"

[dependencies]
khaen-core = { workspace = true }
khaen-designer = { workspace = true }
khaen-modal-design = { workspace = true }
