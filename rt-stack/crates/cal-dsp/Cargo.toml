# 校准里不依赖 rt-host 的部分：反卷积、测点、PEQ 拟合。
# host 要调用 fit_peq / deconvolve，又不能和 tspi-calibration 互相依赖。
[package]
name = "tspi-cal-dsp"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "校准反卷积与 PEQ 拟合（不依赖 rt-host）"

[dependencies]
tspi-dsp-core = { workspace = true }
tspi-fir-designer = { workspace = true }
tspi-modal-design = { workspace = true }
