name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# 直接用 Rust 交叉编译：ubuntu-latest（x86_64 主机）一次构建 x86_64 + aarch64 两个目标。
# CPU 口径见 deploy/build-release.sh（x86-64-v2 / aarch64 generic，均为通用基线；
# AVX2/FMA/NEON 热点由 crates/core 运行期内核派发，不依赖编译 flag，也不针对具体芯片）。
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-cross-two-arch

      - name: System deps (amd64 ALSA + arm64 cross sysroot)
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture arm64
          # Ubuntu 24.04 用 deb822 sources：现有 stanza 限定 amd64，arm64 从 ports 拉
          sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          sudo tee /etc/apt/sources.list.d/ubuntu-arm64.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble noble-updates noble-backports noble-security
          Components: main restricted universe multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update
          # amd64 原生依赖：pkg-config 找本机 ALSA；gcc-aarch64-linux-gnu 带交叉 libc。
          sudo apt-get install -y --no-install-recommends \
            pkg-config gcc-aarch64-linux-gnu libasound2-dev:amd64
          # arm64 ALSA 头/库不装进 dpkg multiarch：amd64 与 ports 的版本偶发错位会让 apt 报
          # “Unable to satisfy dependencies”。只解包到独立交叉 sysroot（AARCH64_SYSROOT）。
          mkdir -p /tmp/arm64-debs
          ( cd /tmp/arm64-debs && apt-get download libasound2-dev:arm64 libasound2t64:arm64 )
          sudo mkdir -p /opt/arm64-sysroot
          for deb in /tmp/arm64-debs/*.deb; do sudo dpkg -x "${deb}" /opt/arm64-sysroot; done
          ls /opt/arm64-sysroot/usr/lib/aarch64-linux-gnu/libasound* >/dev/null

      # 版本唯一事实源 = git tag。Cargo.toml 版本必须与 tag 完全一致，否则不发布。
      # 版本/commit 通过环境变量在编译期注入二进制（build.rs option_env!），
      # 因此二进制里没有“crate 版本 vs release 版本”两个真相。
      - name: Verify tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(python3 -c 'import re; t=open("Cargo.toml").read(); m=re.search(r"\[workspace\.package\][^\[]*?version\s*=\s*\"([^\"]+)\"", t, re.S); print(m.group(1) if m else "")')"
          echo "tag=${VERSION} cargo=${CARGO_VERSION}"
          if [[ "${CARGO_VERSION}" != "${VERSION}" ]]; then
            echo "::error::tag v${VERSION} != Cargo.toml workspace version ${CARGO_VERSION}; bump Cargo.toml (and commit) before tagging" >&2
            exit 1
          fi

      - name: Build both targets (cpu-tuned release)
        env:
          AARCH64_SYSROOT: /opt/arm64-sysroot
        run: |
          set -euo pipefail
          export KHAEN_BUILD_VERSION="${GITHUB_REF_NAME#v}"
          export KHAEN_BUILD_COMMIT="$(git rev-parse HEAD)"
          bash deploy/build-release.sh x86_64-unknown-linux-gnu
          bash deploy/build-release.sh aarch64-unknown-linux-gnu

      - name: Package both targets
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse HEAD)"
          VERSION="${GITHUB_REF_NAME#v}"

          package() {
            local target="$1" arch="$2" cpu_flags="$3"
            local stage="khaen-${VERSION}-linux-${arch}"
            local bin_dir="target/${target}/release"
            mkdir -p "dist/${stage}/bin" "dist/${stage}/deploy" "dist/${stage}/docs"
            find "${bin_dir}" -maxdepth 1 -type f -name 'khaen-*' -perm -u+x -exec cp {} "dist/${stage}/bin/" +
            cp deploy/install.sh deploy/rollback.sh deploy/closed-loop-verdict.sh deploy/smoke-test.sh deploy/build-release.sh deploy/khaen-daemon.service deploy/khaen-rt-host.service deploy/daemon.env.example deploy/rt-host.env.example "dist/${stage}/deploy/"
            cp docs/CLOSED-LOOP.md "dist/${stage}/docs/"
            cp crates/cal-tools/README.md "dist/${stage}/docs/calibration-cli.md"
            cat > "dist/${stage}/BUILD" <<EOF
          schema: khaen-build/v1
          version: ${VERSION}
          commit: ${COMMIT}
          target: ${target}
          built_on: ubuntu-latest (x86_64 host, native + cross)
          rustc: $(rustc -V)
          cpu_flags: ${cpu_flags}
          profile: release (LTO thin, codegen-units=1)
          EOF
            ( cd "dist/${stage}" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS )
            ( cd "dist/${stage}" && sha256sum -c SHA256SUMS > /dev/null )
            python3 - "${stage}" "${VERSION}" "${COMMIT}" "${target}" <<'PY'
          import hashlib, json, pathlib, sys
          stage, version, commit, target = sys.argv[1:5]
          root = pathlib.Path("dist") / stage
          files = []
          for item in sorted(root.rglob("*")):
              if item.is_file() and item.name != "SHA256SUMS":
                  digest = hashlib.sha256(item.read_bytes()).hexdigest()
                  files.append({"path": str(item.relative_to(root)), "bytes": item.stat().st_size, "sha256": digest})
          manifest = {
              "schema": "khaen-release/v1",
              "version": version,
              "commit": commit,
              "target": target,
              "files": files,
          }
          (root / "manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          PY
            ( cd dist && tar -czf "${stage}.tar.gz" "${stage}" )
            ( cd dist && sha256sum "${stage}.tar.gz" > "${stage}.tar.gz.sha256" )
          }

          package x86_64-unknown-linux-gnu x86_64 "-C target-cpu=x86-64-v2"
          package aarch64-unknown-linux-gnu aarch64 "-C target-cpu=generic"
          ls -l dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: khaen-linux-both-arch
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true