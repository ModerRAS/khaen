name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # 发布包里的 deploy/*.sh 会被设备直接执行（install/rollback/smoke-test）；
      # git 若丢了 +x，Linux 上会 Permission denied。这里锁住 git mode=100755。
      - name: Deploy scripts are executable
        run: |
          set -euo pipefail
          for script in deploy/*.sh; do
            mode="$(git ls-files -s "$script" | cut -d' ' -f1)"
            if [ "$mode" != "100755" ]; then
              echo "$script is $mode (expected 100755); run: git update-index --chmod=+x $script" >&2
              exit 1
            fi
          done
      - name: System deps (ALSA dev headers for alsa-sys)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build daemon for deploy smoke test
        run: cargo build -p khaen-daemon
      # 发布包里的 deploy/smoke-test.sh 是部署验收的第一步；用真实 daemon 的
      # process 目标在 CI 里跑一遍，防止它对 /api/status 加法字段之类再次过严。
      - name: Deploy smoke-test against a real daemon
        run: |
          set -euo pipefail
          state="$(mktemp -d)"
          port=18755
          KHAEN_BIND=127.0.0.1:$port \
          KHAEN_STATE_DIR="$state" \
          KHAEN_RT_TARGET=process \
          KHAEN_SPEAKER_TEST=off \
          KHAEN_CAL_BACKEND=off \
          ./target/debug/khaen-daemon >/tmp/khaen-daemon-smoke.log 2>&1 &
          daemon_pid=$!
          cleanup() { kill "$daemon_pid" 2>/dev/null || true; wait "$daemon_pid" 2>/dev/null || true; rm -rf "$state"; }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 100); do
            if curl -fsS "http://127.0.0.1:$port/healthz" >/dev/null 2>&1; then ready=1; break; fi
            sleep 0.1
          done
          if [ "$ready" -ne 1 ]; then
            echo "daemon did not become ready; log:" >&2
            cat /tmp/khaen-daemon-smoke.log >&2
            exit 1
          fi
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"password":"smoke-test-password","confirm":"smoke-test-password"}' \
            "http://127.0.0.1:$port/api/auth/setup" >/dev/null
          KHAEN_SMOKE_PASSWORD=smoke-test-password bash deploy/smoke-test.sh "http://127.0.0.1:$port" 1
      # 安装脚本是部署的第一道门：用最新已发布 release 包在临时 runner 上真实执行一次
      # （--no-restart：不启动/重启任何服务，不碰设备），校验 manifest/BUILD/校验和、
      # release 目录与 current 符号链接。避免设备上才发现 installer 坏了。
      - name: Validate deploy/install.sh against the latest release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh release view --json tagName -q .tagName)"
          echo "latest release: ${latest}"
          rm -rf /tmp/khaen-installer
          mkdir -p /tmp/khaen-installer/extract
          gh release download "${latest}" --pattern '*linux-x86_64.tar.gz*' --dir /tmp/khaen-installer
          tarfile="$(ls /tmp/khaen-installer/khaen-*-linux-x86_64.tar.gz)"
          tar -xzf "${tarfile}" -C /tmp/khaen-installer/extract
          stage="$(find /tmp/khaen-installer/extract -maxdepth 1 -mindepth 1 -type d | head -n 1)"
          test -n "${stage}"
          echo "installing ${tarfile} with the package's own installer: ${stage}/deploy/install.sh"
          sudo bash "${stage}/deploy/install.sh" "${tarfile}" --no-restart
          current="$(readlink -f /opt/khaen/current)"
          echo "current: ${current}"
          test -n "${current}"
          sudo test -x "${current}/bin/khaen-daemon"
          sudo test -x "${current}/bin/khaen-analyze"
          sudo grep -E '^(version|commit):' "${current}/BUILD"
      # 发布包验收：直接用刚安装的最新 release 的 daemon + release 自带的 smoke-test.sh，
      # 在 process 目标（无设备/无声）上建会话并跑只读冒烟；验证“包内二进制 + 包内脚本”组合可用，
      # 而不只是 main 构建的 debug daemon。端口用 18757，避免与前面的 18755 冲突。
      - name: Validate release package smoke-test (daemon + script from latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(readlink -f /opt/khaen/current)"
          echo "release current: ${current}"
          state_dir="$(mktemp -d)"
          daemon_log="/tmp/khaen-release-smoke-daemon.log"
          KHAEN_BIND=127.0.0.1:18757 \
          KHAEN_STATE_DIR="${state_dir}" \
          KHAEN_RT_TARGET=process \
          KHAEN_CAL_BACKEND=off \
          KHAEN_SPEAKER_TEST=off \
            "${current}/bin/khaen-daemon" >"${daemon_log}" 2>&1 &
          daemon_pid=$!
          cleanup() {
            kill "${daemon_pid}" 2>/dev/null || true
            wait "${daemon_pid}" 2>/dev/null || true
            rm -rf "${state_dir}"
          }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:18757/healthz >/dev/null 2>&1; then ready=1; break; fi
            sleep 0.2
          done
          if [ "${ready}" != "1" ]; then
            echo "release daemon did not become ready" >&2
            cat "${daemon_log}" >&2
            exit 1
          fi
          curl -fsS http://127.0.0.1:18757/healthz
          setup_code="$(curl -sS -o /tmp/khaen-release-smoke-setup.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            -d '{"password":"release-smoke-password","confirm":"release-smoke-password"}' \
            http://127.0.0.1:18757/api/auth/setup)"
          echo "auth setup: HTTP ${setup_code}"
          test "${setup_code}" = "201"
          KHAEN_SMOKE_PASSWORD=release-smoke-password \
            bash "${current}/deploy/smoke-test.sh" http://127.0.0.1:18757 1
          kill "${daemon_pid}" 2>/dev/null || true
          wait "${daemon_pid}" 2>/dev/null || true
          trap - EXIT
          rm -rf "${state_dir}"
      # 回滚脚本也是部署安全路径：在临时 runner 上装“上一个 release + 最新 release”，
      # 写 sentinel 验证 install.sh 不覆盖已有 /etc/khaen/daemon.env，再执行 rollback.sh，
      # 断言 current 回到上一个版本（rollback 会重启 khaen-daemon；runner 是一次性的）。
      - name: Validate rollback.sh and env preservation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh release view --json tagName -q .tagName)"
          previous="$(gh release list --limit 2 --json tagName -q '.[1].tagName')"
          echo "latest=${latest} previous=${previous}"
          rm -rf /tmp/khaen-rollback
          mkdir -p /tmp/khaen-rollback
          gh release download "${latest}" --pattern '*linux-x86_64.tar.gz*' --dir /tmp/khaen-rollback
          gh release download "${previous}" --pattern '*linux-x86_64.tar.gz*' --dir /tmp/khaen-rollback
          latest_tar="$(ls /tmp/khaen-rollback/khaen-*-linux-x86_64.tar.gz | grep "${latest#v}")"
          previous_tar="$(ls /tmp/khaen-rollback/khaen-*-linux-x86_64.tar.gz | grep "${previous#v}")"
          sudo rm -rf /opt/khaen /etc/khaen
          sudo rm -f /etc/systemd/system/khaen-daemon.service /etc/systemd/system/khaen-rt-host.service
          mkdir -p /tmp/khaen-rollback/extract-prev /tmp/khaen-rollback/extract-latest
          tar -xzf "${previous_tar}" -C /tmp/khaen-rollback/extract-prev
          tar -xzf "${latest_tar}" -C /tmp/khaen-rollback/extract-latest
          prev_stage="$(find /tmp/khaen-rollback/extract-prev -maxdepth 1 -mindepth 1 -type d | head -n 1)"
          latest_stage="$(find /tmp/khaen-rollback/extract-latest -maxdepth 1 -mindepth 1 -type d | head -n 1)"
          test -n "${prev_stage}" && test -n "${latest_stage}"
          sudo bash "${prev_stage}/deploy/install.sh" "${previous_tar}" --no-restart
          test "$(readlink -f /opt/khaen/current)" = "/opt/khaen/releases/${previous#v}"
          printf 'KHAEN_BIND=127.0.0.1:18756\n# sentinel: must not be overwritten\n' | sudo tee /etc/khaen/daemon.env >/dev/null
          sudo bash "${latest_stage}/deploy/install.sh" "${latest_tar}" --no-restart
          test "$(readlink -f /opt/khaen/current)" = "/opt/khaen/releases/${latest#v}"
          sudo grep -q 'sentinel: must not be overwritten' /etc/khaen/daemon.env
          sudo bash /opt/khaen/current/deploy/rollback.sh
          after="$(readlink -f /opt/khaen/current)"
          echo "after rollback: ${after}"
          test "${after}" = "/opt/khaen/releases/${previous#v}"
          sudo systemctl is-active khaen-daemon
          # 诊断：服务 active 但端口未监听时，多半是 daemon 以非零码退出后 Restart 循环；
          # 打印 unit 状态/日志/env/监听端口，让失败可解释。
          sudo systemctl status khaen-daemon --no-pager -l || true
          sudo journalctl -u khaen-daemon --no-pager -n 80 || true
          sudo cat /etc/khaen/daemon.env || true
          sudo ss -ltnp || true
          healthz="$(curl -fsS --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:18756/healthz)"
          echo "healthz=${healthz}"
          PREV_VERSION="${previous#v}" python3 -c 'import json,os,sys; v=json.loads(sys.argv[1])["version"]; assert v.lstrip("vV")==os.environ["PREV_VERSION"], (v, os.environ["PREV_VERSION"])' "${healthz}"
          sudo grep -E '^(version|commit):' "${after}/BUILD"
          sudo systemctl stop khaen-daemon || true

  webui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: i18n parity
        run: pnpm i18n:check
      - name: Build
        run: pnpm build
      - name: Committed dist is up to date
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain -- webui/dist)" ]; then
            echo "webui/dist is stale: run 'pnpm build' in webui and commit the result"
            git status --short -- webui/dist
            exit 1
          fi
