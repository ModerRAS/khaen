  h16-7.1.4:
    label: "H16 7.1.4 (12ch)"
    description: "7.1.4: flow0 1-8 + flow1 11/12/15/16（Ltf Rtf Ltr Rtr）；9/10/13/14 静音"
    channels: auto
    streams: [8, 4]
    roles:
      - {id: FL, label: L, stream: 0, channel: 0}
      - {id: FR, label: R, stream: 0, channel: 1}
      - {id: C, label: C, stream: 0, channel: 2}
      - {id: LFE, label: LFE, stream: 0, channel: 3}
      - {id: SL, label: Ls, stream: 0, channel: 4}
      - {id: SR, label: Rs, stream: 0, channel: 5}
      - {id: BL, label: Lrs, stream: 0, channel: 6}
      - {id: BR, label: Rrs, stream: 0, channel: 7}
      - {id: TFL, label: Ltf, stream: 1, channel: 0}
      - {id: TFR, label: Rtf, stream: 1, channel: 1}
      - {id: TRL, label: Ltr, stream: 1, channel: 2}
      - {id: TRR, label: Rtr, stream: 1, channel: 3}
  pc-2ch:
    label: "PC / 任意 2ch 源"
    channels: 2
    roles:
      - {id: FL, label: L, channel: 0}
      - {id: FR, label: R, channel: 1}
  pc-8ch:
    label: "PC 8ch (7.1)"
    channels: 8
    roles:
      - {id: FL, label: L, channel: 0}
      - {id: FR, label: R, channel: 1}
      - {id: C, label: C, channel: 2}
      - {id: LFE, label: LFE, channel: 3}
      - {id: SL, label: Ls, channel: 4}
      - {id: SR, label: Rs, channel: 5}
      - {id: BL, label: Lrs, channel: 6}
      - {id: BR, label: Rrs, channel: 7}
