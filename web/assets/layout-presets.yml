# khaen layout/remap presets v2 — 内置模板（随固件发布，只读；WebUI 可复制到 profile 后编辑）
# 口径（2026-11-15）：不做跨布局 downmix/upmix；输入布局与输出布局角色同名直通；remap 只保留同布局（如 5.1.2->5.1.2）。16ch/扩展 SUB 暂停。
# 说明：input_layouts 的通道顺序/通道数是“待 h16-research 核实”的假设；H16 换 layout 后通道数和顺序都会变。
#       输出布局的 outputs 是 MOTU/其他声卡上的物理通道索引假设，WebUI 可改。
schema: khaen-layout-presets/v2

input_layouts:
  h16-5.1:
    label: "H16 5.1 (6ch)"
    description: "5.1: L R C LFE Ls Rs（16 TX 中 1-6）"
    channels: auto
    streams: [6]
    roles:
      - {id: FL, label: L, stream: 0, channel: 0}
      - {id: FR, label: R, stream: 0, channel: 1}
      - {id: C, label: C, stream: 0, channel: 2}
      - {id: LFE, label: LFE, stream: 0, channel: 3}
      - {id: SL, label: Ls, stream: 0, channel: 4}
      - {id: SR, label: Rs, stream: 0, channel: 5}
  h16-7.1:
    label: "H16 7.1 (8ch)"
    description: "7.1: L R C LFE Ls Rs Lrs Rrs（16 TX 中 1-8）"
    channels: auto
    streams: [8]
    roles:
      - {id: FL, label: L, stream: 0, channel: 0}
      - {id: FR, label: R, stream: 0, channel: 1}
      - {id: C, label: C, stream: 0, channel: 2}
      - {id: LFE, label: LFE, stream: 0, channel: 3}
      - {id: SL, label: Ls, stream: 0, channel: 4}
      - {id: SR, label: Rs, stream: 0, channel: 5}
      - {id: BL, label: Lrs, stream: 0, channel: 6}
      - {id: BR, label: Rrs, stream: 0, channel: 7}
  h16-5.1.2:
    label: "H16 5.1.2 (8ch)"
    description: "5.1.2: flow0 1-6(L R C LFE Ls Rs) + flow1 11/12(Ltf Rtf)；待上板核"
    channels: auto
    streams: [6, 2]
    roles:
      - {id: FL, label: L, stream: 0, channel: 0}
      - {id: FR, label: R, stream: 0, channel: 1}
      - {id: C, label: C, stream: 0, channel: 2}
      - {id: LFE, label: LFE, stream: 0, channel: 3}
      - {id: SL, label: Ls, stream: 0, channel: 4}
      - {id: SR, label: Rs, stream: 0, channel: 5}
      - {id: TFL, label: Ltf, stream: 1, channel: 0}
      - {id: TFR, label: Rtf, stream: 1, channel: 1}
  nsp-5.1.2:
    label: "NSP 5.1.2 (8ch single stream)"
    description: "AES67 单流 8ch：L R C LFE Ls Rs Ltf Rtf。中置下混在内容适配，不走 channelmap remap。"
    channels: 8
    streams: [8]
    roles:
      - {id: FL, label: L, stream: 0, channel: 0}
      - {id: FR, label: R, stream: 0, channel: 1}
      - {id: C, label: C, stream: 0, channel: 2}
      - {id: LFE, label: LFE, stream: 0, channel: 3}
      - {id: SL, label: Ls, stream: 0, channel: 4}
      - {id: SR, label: Rs, stream: 0, channel: 5}
      - {id: TFL, label: Ltf, stream: 0, channel: 6}
      - {id: TFR, label: Rtf, stream: 0, channel: 7}
  h16-5.1.4:
    label: "H16 5.1.4 (10ch)"
    description: "5.1.4: flow0 1-6 + flow1 11/12/15/16；待上板核"
    channels: auto
    streams: [6, 4]
    roles:
      - {id: FL, label: L, stream: 0, channel: 0}
      - {id: FR, label: R, stream: 0, channel: 1}
      - {id: C, label: C, stream: 0, channel: 2}
      - {id: LFE, label: LFE, stream: 0, channel: 3}
      - {id: SL, label: Ls, stream: 0, channel: 4}
      - {id: SR, label: Rs, stream: 0, channel: 5}
      - {id: TFL, label: Ltf, stream: 1, channel: 0}
      - {id: TFR, label: Rtf, stream: 1, channel: 1}
      - {id: TRL, label: Ltr, stream: 1, channel: 2}
      - {id: TRR, label: Rtr, stream: 1, channel: 3}
  h16-7.1.2:
    label: "H16 7.1.2 (10ch)"
    description: "7.1.2: flow0 1-8 + flow1 11/12(Ltf Rtf)；待上板核"
    channels: auto
    streams: [8, 2]
    roles:
      - {id: FL, label: L, stream: 0, channel: 0}
      - {id: FR, label: R, stream: 0, channel: 1}
      - {id: C, label: C, stream: 0, channel: 2}
      - {id: LFE, label: LFE, stream: 0, channel: 3}
      - {id: SL, label: Ls, stream: 0, channel: 4}
      - {id: SR, label: Rs, stream: 0, channel: 5}
