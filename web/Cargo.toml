[package]
name = "khaen-audio-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Web console for the audio DSP host"
license = "GPL-3.0-only"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "time", "fs", "io-util", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
async-trait = "0.1"
getrandom = "0.3"
argon2 = "0.5"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[[bin]]
name = "tspi-audio-web"
path = "src/main.rs"
