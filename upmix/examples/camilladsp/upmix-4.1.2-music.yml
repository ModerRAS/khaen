# tspi-upmix 生成：upmix-4.1.2-music
# 输入 2.0（2ch）-> 输出 4.1.2（8ch）；采样率 48000 Hz
# 低电平环绕/高度，尽量保留立体声结像；低音管理 80Hz LR4
# 用途：独立 CamillaDSP（ALSA）
title: tspi-upmix upmix-4.1.2-music（2.0 -> 4.1.2）
description: 低电平环绕/高度，尽量保留立体声结像；低音管理 80Hz LR4
devices:
  samplerate: 48000
  chunksize: 512
  target_level: 1024
  adjust_period: 10
  enable_rate_adjust: true
  queuelimit: 4
  resampler:
    type: AsyncSinc
    profile: Balanced
  capture:
    type: Alsa
    channels: 2
    device: hw:ravenna,0
    format: S32_LE
  playback:
    type: Alsa
    channels: 22
    device: hw:motu,0
    format: S24_3_LE
filters:
  fl_hp:
    type: BiquadCombo
    parameters:
      type: LinkwitzRileyHighpass
      freq: 80.0
      order: 4
  fr_hp:
    type: BiquadCombo
    parameters:
      type: LinkwitzRileyHighpass
      freq: 80.0
      order: 4
  sl_hp:
    type: BiquadCombo
    parameters:
      type: LinkwitzRileyHighpass
      freq: 100.0
      order: 4
  sl_lp:
    type: BiquadCombo
    parameters:
      type: LinkwitzRileyLowpass
      freq: 7000.0
      order: 4
  sl_gain:
    type: Gain
    parameters:
      gain: -6.0
  sl_delay:
    type: Delay
    parameters:
      delay: 15.0
      unit: ms
  sr_hp:
    type: BiquadCombo
    parameters:
      type: LinkwitzRileyHighpass
      freq: 100.0
      order: 4
  sr_lp:
    type: BiquadCombo
    parameters:
      type: LinkwitzRileyLowpass
      freq: 7000.0
      order: 4
  sr_gain:
    type: Gain
    parameters:
      gain: -6.0
  sr_delay:
    type: Delay
    parameters:
      delay: 15.0
      unit: ms
  hfl_gain:
    type: Gain
    parameters:
      gain: -9.0
  hfr_gain:
    type: Gain
    parameters:
      gain: -9.0
  sub1_lp:
    type: BiquadCombo
    parameters:
      type: LinkwitzRileyLowpass
      freq: 80.0
      order: 4
mixers:
  upmix: &id001
    description: upmix：2.0 -> 4.1.2（22ch）
    channels:
      in: 2
      out: 22
    mapping:
    - dest: 0
      sources:
      - channel: 0
    - dest: 1
      sources:
      - channel: 1
    - dest: 2
      sources:
      - channel: 0
        gain: -6.02
      - channel: 1
        gain: -6.02
        inverted: true
    - dest: 3
      sources:
      - channel: 0
        gain: -6.02
        inverted: true
      - channel: 1
        gain: -6.02
    - dest: 4
      sources:
      - channel: 0
        gain: -12.041
      - channel: 1
        gain: -12.041
    - dest: 5
      sources:
      - channel: 0
        gain: -12.041
      - channel: 1
        gain: -12.041
    - dest: 7
      sources:
      - channel: 0
        gain: -6.02
      - channel: 1
        gain: -6.02
  to_outputs: *id001
pipeline:
- type: Mixer
  name: to_outputs
- type: Filter
  description: per-role highpass
  channels:
  - 0
  names:
  - fl_hp
- type: Filter
  description: per-role highpass
  channels:
  - 1
  names:
  - fr_hp
- type: Filter
  description: per-role highpass
  channels:
  - 2
  names:
  - sl_hp
- type: Filter
  description: per-role highpass
  channels:
  - 3
  names:
  - sr_hp
- type: Filter
  description: per-role lowpass
  channels:
  - 2
  names:
  - sl_lp
- type: Filter
  description: per-role lowpass
  channels:
  - 3
  names:
  - sr_lp
- type: Filter
  description: per-role lowpass
  channels:
  - 7
  names:
  - sub1_lp
- type: Filter
  description: per-role gain
  channels:
  - 2
  names:
  - sl_gain
- type: Filter
  description: per-role gain
  channels:
  - 3
  names:
  - sr_gain
- type: Filter
  description: per-role gain
  channels:
  - 4
  names:
  - hfl_gain
- type: Filter
  description: per-role gain
  channels:
  - 5
  names:
  - hfr_gain
- type: Filter
  description: per-role delay
  channels:
  - 2
  names:
  - sl_delay
- type: Filter
  description: per-role delay
  channels:
  - 3
  names:
  - sr_delay
