[package]
name = "khaen-mimo-fir"
license = "GPL-3.0-only"
description = "MIMO FIR building blocks shared by the MIMO design tools"
version = "0.1.0"
edition = "2021"

[dependencies]
realfft = "3"
rustfft = "6"

[[bin]]
name = "khaen-mimo-fir"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
