# ptp4l-slave.conf — 调试/对照用：本机 ptp4l 做 PTPv2 slave
# 用途：验证网内 GM 质量、检查硬件时间戳；**不要与 aes67-daemon/LKM 同时运行**（LKM 在 PRE_ROUTING 截走 PTP）。
# 启动：ptp4l -H -i eth0 -f ptp4l-slave.conf -m
# 查看：pmc -u -b 0 "GET TIME_STATUS_NP"

[global]
domainNumber                0
delay_mechanism             E2E
network_transport           UDPv4
slaveOnly                   1
priority1                   255
priority2                   255
logAnnounceInterval         0
logSyncInterval             -2
logMinDelayReqInterval      0
announceReceiptTimeout      3
udp_ttl                     16
dscp_event                  46
dscp_general                46
