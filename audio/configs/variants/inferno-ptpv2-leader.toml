# inferno-ptpv2-leader.toml — 备选：statime 做 PTPv2 leader（Dante + AES67 混合网络）
#
# 适用：网内没有 PTPv1 主钟，且所有 Dante 设备都开启 AES67（此时 Dante 设备用 PTPv2 跟本机）。
# 不适用：只有 PTPv1 的老 Dante 设备（它们只认 PTPv1；开源无 PTPv1 leader 实现，见 RISKS R3/D2）。
# 未上板验证：启用前做 24h 时钟稳定性与 Dante Controller 观察。
#
# 用法：替换 /etc/statime/inferno-ptpv1.toml 并改名为 inferno-ptpv1.toml（tspi-mode 只渲染该名），
#       或在 overlay 里直接改权威文件；同时确认 Inferno 的 CLOCK_PATH 仍为 /tmp/ptp-usrvclock。

loglevel = "info"
sdo-id = 0
domain = 0
priority1 = 249                 # 比 Dante 硬件设备更优（Dante 设备 PTPv2 常用 249）
priority2 = 0
slave-only = false              # leader/ordinary clock
virtual-system-clock = true
virtual-system-clock-base = "monotonic_raw"
usrvclock-export = true

[[port]]
interface = "eth0"
network-mode = "ipv4"
hardware-clock = "auto"
protocol-version = "PTPv2"

[observability]
observation-path = "/run/tspi/statime-observe.sock"
observation-permissions = 438
