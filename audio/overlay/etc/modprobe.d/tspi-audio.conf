# 固定 USB 音频卡 id：MOTU UltraLite-mk5 (USB 07fd:000c) -> ALSA card id "motu"
#（snd-usb-audio 的 index/id 是数组参数，按插入顺序生效；单 USB 声卡设备最简）
options snd-usb-audio id=motu

# RAVENNA/AES67 内核模块固定 card id：-> ALSA "hw:ravenna,0"
# 模块文件：/lib/modules/$(uname -r)/extra/MergingRavennaALSA.ko（仅模式 B 加载）
options MergingRavennaALSA id=ravenna

# 说明：若将来接多个 USB 音频设备，需去掉上面 id=motu（改用 /dev/snd/by-id）并重跑 tspi-mode。
