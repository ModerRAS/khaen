# RT 权限硬门槛（Debian 默认 ulimit -r=0；Inferno 实测普通用户会失败/静默降级）
# 服务进程另由 systemd 单元 LimitRTPRIO/LimitMEMLOCK 保证；这里覆盖登录 shell 与子进程。
@audio          -       rtprio          99
@audio          -       memlock         unlimited
@audio          -       nice            -19

# root 调试也放开（可选；限制 root 无意义）
root            -       rtprio          99
root            -       memlock         unlimited
