# /etc/asound.conf — Inferno（Dante/AoIP）虚拟 ALSA 设备
# 参数不从本文件写死：由 khaen-mode 生成 /run/khaen/camilladsp.env（INFERNO_* 环境变量），
# 由打开该 PCM 的进程（khaen-camilladsp）继承，Inferno ALSA 插件据此初始化。
# 只定义名为 inferno 的 PCM，不覆盖 default/其它设备，避免影响系统其它程序。

pcm.inferno {
    type inferno
    hint {
        show on
        description "Inferno Dante virtual device (khaen-dsp)"
    }
}

# 说明：MOTU 输出不走 ALSA 插件，CamillaDSP 直接打开 hw:<motu>,0（硬件 22ch，mixer 映射到 0/1）。
# 这样避免 route/plug 插件引入额外拷贝，也便于将来多路分频直接映射到其他物理输出。
