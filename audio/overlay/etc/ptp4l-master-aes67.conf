# /etc/ptp4l-master-aes67.conf -- AES67 PTPv2 grandmaster (B2/B3 only; never with daemon)
# Basis: AES67/Dante interop profile -- domain 0, E2E, announce 1s, sync 250ms,
#        delay-req 1s, TTL 16.
# Start:  ptp4l -H -i ${KHAEN_IFACE} -f /etc/ptp4l-master-aes67.conf -m
# Unit:   khaen-ptp4l-master.service (ConditionPathExists=/run/khaen/active-aes67-master)
# Prereq: NIC hardware timestamping (ethtool -T end0 shows *_HARDWARE; PHC 0 = /dev/ptp0).
# Notes:
#  * linuxptp's config parser does NOT support trailing inline comments -> keep every
#    comment on its own line, otherwise values like "0  # 1 s" fail to parse.
#  * No per-interface sections: the port interface is selected by "-i end0".
#  * MergingRavennaALSA LKM (mode B1) steals PTP in PRE_ROUTING -> never load it while
#    running this grandmaster.

[global]
domainNumber                0
delay_mechanism             E2E
network_transport           UDPv4
slaveOnly                   0
masterOnly                  1
priority1                   0
priority2                   0
clockClass                  248
clockAccuracy               0xFE
offsetScaledLogVariance     0xFFFF
logAnnounceInterval         0
logSyncInterval             -2
logMinDelayReqInterval      0
announceReceiptTimeout      3
syncReceiptTimeout          0
transportSpecific           0x0
ptp_dst_mac                 01:1B:19:00:00:00
udp_ttl                     16
dscp_event                  46
dscp_general                46

# UDS control socket used by pmc (inside the service RuntimeDirectory /run/ptp4l).
# Query: pmc -s /run/ptp4l/uds -u -b 0 'GET PORT_DATA_SET'
uds_address                 /run/ptp4l/uds