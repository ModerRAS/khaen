# /etc/statime/inferno-ptpv1.toml — teodly/statime fork（PTPv1 slave）模板
# khaen-mode 会把 __IFACE__ 渲染为 /run/khaen/statime.toml 后启动；改动本文件即可持久化。
# 依据：上游 inferno-ptpv1.toml + statime-linux config（kebab-case；deny_unknown_fields）。

loglevel = "info"              # trace 用于排障（量大）

# PTP 网络
sdo-id = 0
domain = 0
priority1 = 251                # Dante 硬件设备在 PTPv2 用 249；这里保持 Inferno 默认
slave-only = true              # PTPv1 只能做 follower（fork 限制，见 RISKS R3）

# 虚拟系统时钟：不直接改系统时间，通过 usrvclock 把“叠加时钟”导出给 Inferno
virtual-system-clock = true
virtual-system-clock-base = "monotonic_raw"   # 避免 NTP 跳变污染媒体时钟
usrvclock-export = true
# usrvclock-path = "/tmp/ptp-usrvclock"       # 默认值，与 Inferno CLOCK_PATH 默认一致

[[port]]
interface = "__IFACE__"
network-mode = "ipv4"          # 也可 ethernet
hardware-clock = "auto"        # RK3576 GMAC 有 PHC 时自动用硬件时间戳
protocol-version = "PTPv1"

# 观测 socket：khaen-ptp-status / khaen-mode status 读这里的 JSON（含 current_ds.offset_from_master）
[observability]
observation-path = "/run/khaen/statime-observe.sock"
observation-permissions = 438   # 0o666 的十进制；root 写，web-manager 可读
metrics-exporter-listen = "127.0.0.1:9975"
