# tspi-upmix 预设 v1 —— 2.0 立体声上混参数（用户当前/常用布局：4.1.2、5.3.2）
#
# 用法：
#   tspi-upmix list                        列出预设
#   tspi-upmix show upmix-4.1.2-music      查看解析后的每角色矩阵/滤波/延迟
#   tspi-upmix profile <id> -o profiles/upmix-xxx.yml
#   tspi-upmix camilla <id> -o camilladsp/upmix-xxx.yml
#   tspi-upmix all -o dist/
#
# 参数含义见 docs/ALGORITHM.md。所有增益单位 dB、延迟 ms、频率 Hz。
# 天空声道策略（用户裁决 2026-11-16）：HFL/HFR 按普通全频声道处理，不做高通/低通、
#   不做人工去相关延迟（height.delay_ms=0、mode=broadband）。需要带限时必须在预设里显式写
#   mode: bandlimited + highpass/lowpass，默认不启用。
# 约束（与 tspi-channelmap v2 校验一致）：source/role gain ∈ [-60,12]；delay ∈ [0,200]ms；
#   LinkwitzRiley 分频 order ∈ {2,4,6,8}，freq ∈ [20, 24000)。
schema: tspi-upmix/v1
version: 1

defaults:
  samplerate: 48000
  chunksize: 512
  target_level: 1024
  adjust_period: 10
  # layout-presets 只在需要读取布局角色顺序时使用；未找到则用内置 4.1.2 / 5.3.2 定义。
  layout_presets: /etc/tspi-audio/layout-presets.yml

presets:
  # ===== 4.1.2（地面 4 + 1 低音 + 2 高度；无中置） =====
  upmix-4.1.2-music:
    label: "2.0 → 4.1.2 · 音乐（温和）"
    description: "低电平环绕/高度，尽量保留立体声结像；低音管理 80Hz LR4"
    layout: "4.1.2"
    front:
      gain_db: 0.0            # FL/FR 不额外增益；bass 启用时仍过 80 Hz LR4 HP（不是 bit-exact）
    center:
      enabled: false          # 4.1.2 无中置，占位以便切换布局
      gain_db: -6.0
      extract_gain_db: -6.02
      delay_ms: 0.0
      highpass: {freq: 200, order: 4, type: LinkwitzRiley}
      lowpass: {freq: 12000, order: 4, type: LinkwitzRiley}
    surround:
      mode: difference        # difference = (L-R)/2（经典无源矩阵）
      gain_db: -6.0           # 环绕总增益（相对差信号）
      extract_gain_db: -6.02  # 每个输入进入差信号的增益（-6.02 = ×0.5）
      ambience_gain_db: null  # 附加同相 mid 分量（null=关；-12 = 轻微填充）
      delay_ms: 15.0
      delay_spread_ms: 0.0    # 右环绕额外延迟（>0 时左右环绕去相关/展宽）
      highpass: {freq: 100, order: 4, type: LinkwitzRiley}
      lowpass: {freq: 7000, order: 4, type: LinkwitzRiley}
    height:
      mode: broadband         # 用户裁决 2026-11-16：天空声道按普通全频声道处理（不做带限）
      source: mid             # mid = (L+R)/2；side = (L-R)/2
      gain_db: -9.0
      extract_gain_db: -6.02
      width: 0.0              # 0 = 双高同信号（mid）；1 = 左右各自直达；中间为混合
      delay_ms: 0.0           # 不做人工去相关延迟
      delay_spread_ms: 0.0
    bass:
      enabled: true
      redirect_from: auto     # 仅校验用/未生效：SUB 实际只取 FL/FR 的 mid；C/SL/SR 低频不汇总（重构 deferred）
      extract_gain_db: -6.02  # 每个主声道进入 SUB 的增益（-6.02 = 平均，0 = 直接求和 +6dB）
      mains_highpass: {freq: 80, order: 4, type: LinkwitzRiley}
      sub_lowpass: {freq: 80, order: 4, type: LinkwitzRiley}
      sub_gain_db: 0.0
      sub_trims: []           # 每 SUB 额外微调，如 [{gain_db:-2, delay_ms:2}]（多低音对齐）
    decor:
      mode: delay             # delay = 靠延迟/延迟差去相关；allpass = 随机相位全通 Biquad 级联（不是 FIR）
      allpass_stages: 4
      allpass_seed: 101

  upmix-4.1.2-movie:
    label: "2.0 → 4.1.2 · 电影（包围感）"
    description: "环绕/高度更响、延迟略长，对白靠 FL/FR 虚拟中置"
    layout: "4.1.2"
    front: {gain_db: 0.0}
    center:
      enabled: false
      gain_db: -3.0
      extract_gain_db: -6.02
      delay_ms: 0.0
      highpass: {freq: 200, order: 4, type: LinkwitzRiley}
      lowpass: {freq: 12000, order: 4, type: LinkwitzRiley}
    surround:
      mode: difference
      gain_db: -3.0
      extract_gain_db: -6.02
      ambience_gain_db: -18.0
      delay_ms: 18.0
      delay_spread_ms: 0.0
      highpass: {freq: 100, order: 4, type: LinkwitzRiley}
      lowpass: {freq: 8000, order: 4, type: LinkwitzRiley}
    height:
      mode: broadband
      source: mid
      gain_db: -6.0
      extract_gain_db: -6.02
      width: 0.3
      delay_ms: 0.0
      delay_spread_ms: 0.0
    bass:
      enabled: true
      redirect_from: auto     # 仅校验用/未生效：SUB 实际只取 FL/FR mid
      extract_gain_db: -6.02
      mains_highpass: {freq: 80, order: 4, type: LinkwitzRiley}
      sub_lowpass: {freq: 80, order: 4, type: LinkwitzRiley}
      sub_gain_db: 0.0
      sub_trims: []
    decor:
      mode: delay
      allpass_stages: 4
      allpass_seed: 101

  upmix-4.1.2-wide:
    label: "2.0 → 4.1.2 · 宽场（去相关）"
    description: "环绕/高度左右延迟差 3ms，制造扩散感（音乐/现场）"
    layout: "4.1.2"
    front: {gain_db: 0.0}
    center:
      enabled: false
      gain_db: -6.0
      extract_gain_db: -6.02
      delay_ms: 0.0
      highpass: {freq: 200, order: 4, type: LinkwitzRiley}
      lowpass: {freq: 12000, order: 4, type: LinkwitzRiley}
    surround:
      mode: difference
      gain_db: -4.0
      extract_gain_db: -6.02
      ambience_gain_db: -15.0
      delay_ms: 14.0
      delay_spread_ms: 3.0
      highpass: {freq: 100, order: 4, type: LinkwitzRiley}
      lowpass: {freq: 7000, order: 4, type: LinkwitzRiley}
    height:
      mode: broadband
      source: mid
      gain_db: -7.0
      extract_gain_db: -6.02
      width: 0.5
      delay_ms: 0.0
      delay_spread_ms: 0.0
    bass:
      enabled: true
      redirect_from: auto     # 仅校验用/未生效：SUB 实际只取 FL/FR mid
      extract_gain_db: -6.02
      mains_highpass: {freq: 80, order: 4, type: LinkwitzRiley}
      sub_lowpass: {freq: 80, order: 4, type: LinkwitzRiley}
      sub_gain_db: 0.0
      sub_trims: []
    decor:
      mode: delay
      allpass_stages: 4
      allpass_seed: 101

  # ===== 5.3.2（FL/FR/C/SL/SR + SUB1-3 + HFL/HFR） =====
  upmix-5.3.2-music:
    label: "2.0 → 5.3.2 · 音乐（温和）"
    description: "中置轻提取（-6dB），环绕/高度低电平；3 个 SUB 同信号（可按房间微调）"
    layout: "5.3.2"
    front: {gain_db: 0.0}
    center:
      enabled: true
      gain_db: -6.0
      extract_gain_db: -6.02
      delay_ms: 0.0
      highpass: {freq: 200, order: 4, type: LinkwitzRiley}
      lowpass: {freq: 12000, order: 4, type: LinkwitzRiley}
    surround:
      mode: difference
      gain_db: -6.0
      extract_gain_db: -6.02
      ambience_gain_db: null
      delay_ms: 15.0
      delay_spread_ms: 0.0
      highpass: {freq: 100, order: 4, type: LinkwitzRiley}
      lowpass: {freq: 7000, order: 4, type: LinkwitzRiley}
    height:
      mode: broadband         # 用户裁决 2026-11-16：天空声道按普通全频声道处理（不做带限）
      source: mid
      gain_db: -9.0
      extract_gain_db: -6.02
      width: 0.0
      delay_ms: 0.0           # 不做人工去相关延迟
      delay_spread_ms: 0.0
    bass:
      enabled: true
      redirect_from: auto     # 仅校验用/未生效：SUB 实际只取 FL/FR mid
      extract_gain_db: -6.02
      mains_highpass: {freq: 80, order: 4, type: LinkwitzRiley}
      sub_lowpass: {freq: 80, order: 4, type: LinkwitzRiley}
      sub_gain_db: 0.0
      sub_trims: []
    decor:
      mode: delay
      allpass_stages: 4
      allpass_seed: 101

  upmix-5.3.2-movie:
    label: "2.0 → 5.3.2 · 电影（对白/包围）"
    description: "中置 -3dB 提取对白；环绕 -3dB、高度 -6dB；低频 80Hz 分频"
    layout: "5.3.2"
    front: {gain_db: 0.0}
    center:
      enabled: true
      gain_db: -3.0
      extract_gain_db: -6.02
      delay_ms: 0.0
      highpass: {freq: 200, order: 4, type: LinkwitzRiley}
      lowpass: {freq: 12000, order: 4, type: LinkwitzRiley}
    surround:
      mode: difference
      gain_db: -3.0
      extract_gain_db: -6.02
      ambience_gain_db: -18.0
      delay_ms: 18.0
      delay_spread_ms: 0.0
      highpass: {freq: 100, order: 4, type: LinkwitzRiley}
      lowpass: {freq: 8000, order: 4, type: LinkwitzRiley}
    height:
      mode: broadband
      source: mid
      gain_db: -6.0
      extract_gain_db: -6.02
      width: 0.3
