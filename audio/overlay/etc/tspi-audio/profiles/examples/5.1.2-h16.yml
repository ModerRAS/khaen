# tspi-audio channelmap v2 示例 profile（不激活；WebUI 可一键套用/复制后改）
schema: tspi-channelmap/v2
version: 2
profile:
  name: "5.1.2-h16"
  description: "H16 5.1.2 -> 5.1.2 直通"
input:
  layout: "h16-5.1.2"
  channels: auto   # 实测/用户选择；auto 时 apply 需 probe 或 WebUI 选
output:
  device: auto
  channels: 8  # 以 ALSA 实测为准；这里给 fallback
  layout: "5.1.2"
remap:
  preset: "5.1.2->5.1.2"
