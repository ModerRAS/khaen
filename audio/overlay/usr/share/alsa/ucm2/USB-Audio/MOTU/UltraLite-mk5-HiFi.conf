# khaen-audio：MOTU UltraLite-mk5 的**精简版** UCM HiFI 配置（回移到 Debian 12 / alsa-lib 1.2.8，Syntax 6）。
# 上游完整版（含 SplitPCM stereo 设备等）见 alsa-ucm-conf v1.2.13：
#   ucm2/USB-Audio/MOTU/UltraLite-mk5-HiFi.conf
# 精简原因：v1.2.8 的 SplitPCM 宏对“HWChannels=22 但只给 2 个通道位置”的用法未验证；
# 本设备对 CamillaDSP 主链路不是必需（CamillaDSP 直接打开 hw:<motu>,0）。

SectionDevice."Full" {
	Comment "MOTU UltraLite-mk5 full playback (22ch out / 20ch in)"
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId}"
		PlaybackChannels 22
		CapturePriority 100
		CapturePCM "hw:${CardId}"
		CaptureChannels 20
	}
}
