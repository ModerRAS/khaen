# khaen AES67 PTP slave（linuxptp 4.x）
#
# 本机（N150 / enp2s0, Realtek r8169）没有 PHC：必须用 -S 软件时间戳。
# 默认 observation-only：只读锁状态/offset，不改系统时钟（clock_servo nullf）。
#
# 要让 PTP 接管 CLOCK_REALTIME：
#   1) clock_servo 改 pi
#   2) sudo systemctl stop --now systemd-timesyncd
#   3) sudo systemctl restart khaen-ptp-slave@enp2s0.service
#
# 校验：pmc -u -b 0 'GET TIME_STATUS_NP' 'GET CURRENT_DATA_SET'
[global]
domainNumber            0
slaveOnly               1
time_stamping           software
clock_servo             nullf
logAnnounceInterval     1
logSyncInterval         0
logMinDelayReqInterval  0
announceReceiptTimeout  3
